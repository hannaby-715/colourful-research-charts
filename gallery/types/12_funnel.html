<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funnel chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
body{margin:0;padding:40px 22px;background:#F9F2EF;color:#2A2A3A;
     font-family:'Source Sans 3', 'Open Sans', sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.figure{max-width:1000px;margin:0 auto;background:#FFFFFF;border-radius:20px;
        box-shadow:0 14px 34px rgba(43,37,33,.10);overflow:hidden}
.head{padding:26px 34px 0}
.head h1{margin:0 0 6px;font-family:'Fraunces', Georgia, serif;font-size:29px;font-weight:700;
        letter-spacing:-.02em;color:#2A2A3A}
.head p{margin:0;font-size:15.5px;color:#817E86}
.body{padding:18px 34px 26px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 10px;font-size:14px;color:#817E86}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.foot{padding:18px 34px 24px;background:#D49E8A}
.foot .cap{margin:0 0 6px;font-size:14.5px;font-weight:600;color:#2A2A3A}
.foot .note{margin:0;font-size:12.5px;color:#817E86}
</style></head>
