<style>
*{box-sizing:border-box}
body{margin:0;padding:40px 22px;background:#FFF7E8;color:#2B2521;

.figure{max-width:1000px;margin:0 auto;background:#FFFFFF;border-radius:20px;

.body{padding:18px 34px 26px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 10px;font-size:14px;color:#847D75}

.foot{padding:18px 34px 24px;background:#F4E9DC}
.foot .cap{margin:0 0 6px;font-size:14.5px;font-weight:600;color:#2B2521}
